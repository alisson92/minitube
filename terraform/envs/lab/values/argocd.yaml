# Values for the argo-cd chart (https://artifacthub.io/packages/helm/argo/argo-cd),
# version pinned via var.argocd_chart_version in terraform/envs/lab/argocd.tf.
# Sized for a 2x t3.medium spot node group already hosting the api/transcoder
# workloads — every component left enabled gets explicit resources, since the
# chart ships all of them with `resources: {}` (no limits) by default.

# No SSO configured yet — Dex would just sit idle.
dex:
  enabled: false

# No notification channel (Slack/email/webhook) configured yet.
notifications:
  enabled: false

# TLS terminates at the ALB (gitops/platform/argocd/ingress.yaml uses the
# persistent ACM cert, Phase 4) and forwards plain HTTP to argocd-server --
# without this, the server keeps expecting a TLS handshake on that plain
# HTTP connection and the ALB target group reports unhealthy.
configs:
  params:
    server.insecure: true

controller:
  # Memory limit bumped from the original 512Mi after a real OOMKill during
  # a fresh apply -- the controller crashed mid-sync applying every
  # Application's first sync at once (~24 PrometheusRule/ServiceMonitor
  # objects included). CPU was never the issue.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# No global.additionalLabels here on purpose: the chart's own
# app.kubernetes.io/part-of=argocd label is what its settings-manager
# informer uses to find argocd-cm/argocd-secret -- overriding it (e.g. to
# "minitube") breaks argocd-server/application-controller at startup even
# though the configmap really exists. The "part-of: minitube" grouping
# already lives on the Namespace itself.
