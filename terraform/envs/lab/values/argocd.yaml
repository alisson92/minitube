# Values for the argo-cd chart (https://artifacthub.io/packages/helm/argo/argo-cd),
# version pinned via var.argocd_chart_version in terraform/envs/lab/argocd.tf.
# Sized for a 2x t3.medium spot node group already hosting the api/transcoder
# workloads — every component left enabled gets explicit resources, since the
# chart ships all of them with `resources: {}` (no limits) by default.

# No SSO configured yet — Dex would just sit idle.
dex:
  enabled: false

# No notification channel (Slack/email/webhook) configured yet.
notifications:
  enabled: false

# TLS terminates at the ALB (gitops/plataforma/argocd/ingress.yaml uses the
# persistent ACM cert, Phase 4) and forwards plain HTTP to argocd-server --
# without this, the server keeps expecting a TLS handshake on that plain
# HTTP connection and the ALB target group reports unhealthy.
configs:
  params:
    server.insecure: true

controller:
  # memory limit bumped from 256Mi/512Mi (Phase 3 sizing, before Phase 5)
  # after a real OOMKill (exit 137) during a fresh Phase 6 apply: the
  # controller crashed mid-sync while server-side-applying the ~24
  # PrometheusRule/ServiceMonitor objects the kube-prometheus-stack chart
  # brings (Phase 5), on top of every other Application's first sync
  # happening at once. It kept crash-looping on retry instead of ever
  # finishing that batch, leaving "kube-prometheus-stack"/"platform"
  # permanently OutOfSync. CPU was never the issue (not OOMKilled on CPU),
  # so only memory is raised here.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# No global.additionalLabels here on purpose: the chart already sets
# app.kubernetes.io/part-of=argocd on argocd-cm/argocd-secret, and ArgoCD's
# own settings-manager informer filters on that exact label to find its
# config. Overriding it (e.g. to "minitube") silently breaks argocd-server
# and the application-controller at startup ("configmap argocd-cm not
# found", CrashLoopBackOff) even though the configmap really exists --
# discovered the hard way during Phase 3 validation. The "part-of: minitube"
# grouping already lives on the Namespace itself (kubernetes_namespace_v1.argocd).
