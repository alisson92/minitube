# Scrapes app/api's /metrics (exposed via prometheus-fastapi-instrumentator,
# see app/api/main.py) for the SLO rules in slo-rules.yaml and the "dia do
# jogo" dashboard's latency panels. Lives here (minitube-platform), not next
# to the Service it targets (minitube-app) -- the AppProject
# minitube-platform doesn't allow minitube-app as a sync destination, but a
# ServiceMonitor doesn't need to: namespaceSelector below points it at the
# Service's real namespace regardless of where this CR itself is created.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api
  namespace: minitube-platform
  labels:
    app.kubernetes.io/part-of: minitube
spec:
  namespaceSelector:
    matchNames:
      - minitube-app
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  endpoints:
    # Named port "http" on the api Service (gitops/app/service.yaml), not a
    # port number -- ServiceMonitor endpoints reference Service ports by name.
    - port: http
      path: /metrics
      interval: 30s
