# Annotated with the IRSA role from terraform/envs/lab/iam-app.tf
# (app_irsa_role_arn output) — the role's trust policy only accepts this
# exact namespace/service-account pair. Account ID hardcoded like the rest of
# the repo (e.g. terraform state backend keys) since this project uses a
# single fixed AWS account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: minitube-app
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: minitube
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::479213212405:role/minitube-app-irsa-role
