# Catch-all (no host:) on purpose: app.<domain> is CloudFront's alias
# (terraform/envs/lab/cloudfront.tf), which routes /api/* here uncached --
# a host-based rule would collide with that Terraform-managed alias instead
# of complementing it. Shares the same IngressGroup as
# gitops/platform/argocd/ingress.yaml (group.name: minitube) so the
# aws-load-balancer-controller provisions one ALB, not two. See
# docs/adr/008-cloudfront-dns-tls.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: minitube-app
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: minitube
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: minitube
    # Higher number = lower priority. This rule has no host: (catch-all), so
    # it must be evaluated LAST -- otherwise the ALB matches it before the
    # host-specific argocd-server rule and every request (including
    # argocd.<domain>) lands here instead. Discovered on the first real
    # test: argocd.<domain> was silently served by this api backend
    # (HTTP 404 from uvicorn) instead of ArgoCD.
    alb.ingress.kubernetes.io/group.order: "20"
    # Set identically on gitops/platform/argocd/ingress.yaml -- must match
    # across every member of the group, so this predictable name (not an
    # auto-generated one) is what terraform/envs/lab/cloudfront.tf's
    # `data "aws_lb"` looks up by.
    alb.ingress.kubernetes.io/load-balancer-name: minitube-app
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Without this, the LBC defaults the target group health check to the
    # Ingress path (/), which the API doesn't implement -- every target
    # stayed unhealthy and every request through the ALB 502'd, discovered
    # testing app.minitube.../api/ directly (the functional validation
    # script never exercises this path -- it uploads via kubectl
    # port-forward straight to the Service). /api/healthz, not /healthz:
    # this health check hits the pod directly, and every route the app
    # serves lives under /api (see app/api/main.py).
    alb.ingress.kubernetes.io/healthcheck-path: /api/healthz
    # Persistent ACM wildcard cert from terraform/bootstrap/dns.tf -- safe to
    # hardcode, same pattern as var.operator_role_arn. Re-fetch via
    # `terraform output -raw acm_certificate_arn` (bootstrap/) if reissued.
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:479213212405:certificate/3aec10c8-c0e3-4376-bbc6-943f17d3298d"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
