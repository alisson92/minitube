# Reconciled continuously by ArgoCD (Application "app", see
# terraform/envs/lab/argocd.tf) from Phase 3 onward — never apply this
# manually. See docs/adr/007-argocd-gitops-bootstrap.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount-api.yaml
  - serviceaccount-transcoder.yaml
  - role.yaml
  - rolebinding.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
