apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: minitube-app
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: minitube
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    # Named -- the Prometheus ServiceMonitor
    # (gitops/platform/kube-prometheus-stack/servicemonitor-api.yaml)
    # references this port by name, not number.
    - name: http
      port: 80
      targetPort: 8000
