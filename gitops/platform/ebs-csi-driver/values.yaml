# Static values for the aws-ebs-csi-driver chart. controller.serviceAccount
# .annotations (the IRSA role ARN) is injected via helm.parameters -- note
# the nested `controller.` prefix, unlike the other add-ons' top-level
# `serviceAccount.*`. Only the controller talks to the AWS API; the node
# DaemonSet only mounts/formats locally, no IRSA role needed.
controller:
  replicaCount: 1 # chart default is 2 -- 1 is enough for a lab, saves a pod slot
  serviceAccount:
    create: true
    name: ebs-csi-controller-sa
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

node:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
