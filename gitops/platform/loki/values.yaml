# Static values for the loki chart. SingleBinary mode with filesystem
# storage on a PVC -- not SimpleScalable/distributed with an S3 backend, to
# avoid a new bucket + IRSA role for an environment torn down every
# session. No IRSA role at all: Loki never calls the AWS API.
deploymentMode: SingleBinary

loki:
  auth_enabled: false # single-tenant lab, no need for per-tenant isolation
  commonConfig:
    replication_factor: 1 # matches singleBinary.replicas: 1 below
  storage:
    type: filesystem
  # Chart-documented shortcut for exactly this use case (single-binary,
  # filesystem, torn down every session) -- avoids hand-writing a
  # schema_config with no real benefit here.
  useTestSchema: true
  limits_config:
    # Session-scoped lab, not long-term log storage -- matches
    # prometheus.prometheusSpec.retention in ../kube-prometheus-stack/values.yaml.
    retention_period: 24h
  compactor:
    retention_enabled: true
    # Loki 3.x requires this when retention is enabled -- omitting it fails
    # the pod at startup (found on first deploy, loki-0 CrashLoopBackOff).
    delete_request_store: filesystem

# deploymentMode: SingleBinary above doesn't zero these out by itself --
# the chart's render fails if both it and these targets have replicas > 0.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Grafana talks directly to the `loki` Service (ClusterIP, in-cluster) --
# the gateway (nginx reverse proxy in front of Loki, meant for
# authenticating external/multi-tenant access) is unnecessary here and
# would just be one more pod.
gateway:
  enabled: false

# Each is a separate memcached StatefulSet (2 more pods) -- real value at
# production query volume, negligible for a lab. Consistent with the
# pod-density budget in docs/adr/011-observability-stack.md.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Loki's own self-monitoring stack (a second Prometheus + Grafana Agent)
# would be redundant with the kube-prometheus-stack already being deployed
# alongside it.
monitoring:
  selfMonitoring:
    enabled: false
  serviceMonitor:
    enabled: false
  dashboards:
    enabled: false

# loki-canary: a synthetic log-generation/verification DaemonSet, useful for
# ongoing production monitoring -- unnecessary overhead for a lab, and one
# more pod-slot per node on an already pod-dense t3.medium (see
# docs/adr/011-observability-stack.md).
test:
  enabled: false
lokiCanary:
  enabled: false
