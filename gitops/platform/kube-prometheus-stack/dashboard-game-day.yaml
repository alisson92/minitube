# The "game day" dashboard (Phase 5 completion criterion, ADR 011) was
# built ad hoc in the Grafana UI and never committed -- with
# grafana.persistence.enabled: false, it disappeared on every recreate.
# This ConfigMap (provisioned via the sidecar, grafana_dashboard label)
# fixes that, surviving every future apply/destroy cycle.
#
# CDN hit ratio needs CloudFront "Additional metrics" enabled (extra cost,
# not currently on) -- shows "No data" without it; already confirmed by
# other means (X-Cache header) in scripts/validate-cloudfront-dns-tls.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-game-day
  namespace: minitube-platform
  labels:
    app.kubernetes.io/part-of: minitube
    grafana_dashboard: "1"
data:
  game-day.json: |
    {
      "title": "Game Day",
      "tags": ["minitube", "phase-6"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "distribution_id",
            "type": "query",
            "datasource": "CloudWatch",
            "query": {
              "queryType": "Dimension Values",
              "namespace": "AWS/CloudFront",
              "metricName": "Requests",
              "dimensionKey": "DistributionId",
              "region": "us-east-1"
            },
            "refresh": 2
          },
          {
            "name": "load_balancer",
            "type": "query",
            "datasource": "CloudWatch",
            "query": {
              "queryType": "Dimension Values",
              "namespace": "AWS/ApplicationELB",
              "metricName": "RequestCount",
              "dimensionKey": "LoadBalancer",
              "region": "us-east-1"
            },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "CDN Hit Ratio (CloudFront)",
          "description": "Requires 'Additional metrics' enabled on the distribution -- if empty, see the X-Cache header confirmed in scripts/validate-cloudfront-dns-tls.sh as alternative evidence.",
          "type": "timeseries",
          "datasource": "CloudWatch",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "region": "us-east-1",
              "namespace": "AWS/CloudFront",
              "metricName": "CacheHitRate",
              "dimensions": { "DistributionId": "$distribution_id", "Region": "Global" },
              "statistic": "Average"
            }
          ]
        },
        {
          "id": 2,
          "title": "API Latency (p95 / p99)",
          "description": "SLO thresholds (gitops/platform/kube-prometheus-stack/slo-rules.yaml): warning 250ms, critical 800ms.",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.25 },
                  { "color": "red", "value": 0.8 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{handler=~\"/api.*\"}[5m])) by (le))",
              "legendFormat": "p95"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{handler=~\"/api.*\"}[5m])) by (le))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 3,
          "title": "Saturation (HPA replicas + node CPU)",
          "description": "Confirms the wave scaling pattern (docs/runbooks/load/run-k6-waves.md): replicas rising and falling, node CPU with headroom even at peak.",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"minitube-app\", horizontalpodautoscaler=\"api\"}",
              "legendFormat": "api replicas"
            },
            {
              "refId": "B",
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "node CPU {{instance}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "ALB Errors (5xx)",
          "type": "timeseries",
          "datasource": "CloudWatch",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "region": "us-east-1",
              "namespace": "AWS/ApplicationELB",
              "metricName": "HTTPCode_Target_5XX_Count",
              "dimensions": { "LoadBalancer": "$load_balancer" },
              "statistic": "Sum",
              "alias": "target 5xx"
            },
            {
              "refId": "B",
              "region": "us-east-1",
              "namespace": "AWS/ApplicationELB",
              "metricName": "HTTPCode_ELB_5XX_Count",
              "dimensions": { "LoadBalancer": "$load_balancer" },
              "statistic": "Sum",
              "alias": "elb 5xx"
            }
          ]
        }
      ]
    }
