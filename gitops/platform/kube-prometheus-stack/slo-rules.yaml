# SLOs for the "game day" dashboard. Latency thresholds revised with real
# k6 data (docs/runbooks/load/run-k6-breakpoint.md), replacing the original
# 500ms placeholder (docs/adr/011-observability-stack.md).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: minitube-api-slo
  namespace: minitube-platform
  labels:
    app.kubernetes.io/part-of: minitube
spec:
  groups:
    - name: minitube-api-slo
      rules:
        - alert: APIAvailabilitySLOBreach
          # Free from kube-state-metrics -- no app instrumentation needed.
          expr: kube_deployment_status_replicas_available{namespace="minitube-app", deployment="api"} < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "API has had no available replicas for more than 5 minutes"
        - alert: APILatencyWarning
          # 250ms sits comfortably above every normal-operation p95 observed
          # (baseline: 50-190ms; post-HPA breakpoint: 48ms) -- fires while
          # still healthy but trending up, before APILatencyCritical below.
          expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{handler=~"/api.*"}[5m])) by (le)) > 0.25
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "API p95 latency above 250ms for more than 5 minutes"
        - alert: APILatencyCritical
          # 800ms matches the confirmed onset of real queueing at the HPA's
          # maxReplicas:6 ceiling -- genuine backpressure, not errors (0%
          # http_req_failed). See docs/runbooks/load/run-k6-breakpoint.md.
          expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{handler=~"/api.*"}[5m])) by (le)) > 0.8
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "API p95 latency above 800ms for more than 5 minutes -- likely saturation at the HPA's current ceiling (maxReplicas: 6)"
