# Static values for the kube-prometheus-stack chart. grafana.serviceAccount
# .annotations (the IRSA role ARN) is injected dynamically via
# helm.parameters in terraform/envs/lab/argocd.tf instead -- not known
# until Terraform creates the role.

# EKS's control plane (scheduler/controller-manager/etcd) is managed by AWS
# and not reachable for scraping -- leaving these enabled (the chart
# default, written for self-managed clusters) leaves their ServiceMonitors
# permanently `down`, pure noise on a managed cluster.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false

prometheus:
  prometheusSpec:
    # Discover ServiceMonitors/PrometheusRules from any namespace/labels, not
    # just this release's own -- needed for servicemonitor-api.yaml/
    # slo-rules.yaml, neither of which belongs to this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    # This is a session-scoped lab, not long-term monitoring -- no reason to
    # retain metrics beyond a single working session.
    retention: 24h
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    # No storageSpec: silences/notification state don't need to survive a
    # pod restart in an environment destroyed at the end of every session.

grafana:
  serviceAccount:
    create: true
    # Overridden explicitly -- see local.platform_service_accounts.grafana
    # in terraform/envs/lab/iam-platform.tf for why this can't be left to
    # the chart's release-name-derived default.
    name: grafana
  # Dashboards are provisioned as code via the sidecar (ConfigMaps labeled
  # grafana_dashboard, ver terraform/envs/lab GitOps convention), not
  # created/edited in the UI -- no reason to persist Grafana's own SQLite
  # state across restarts.
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.minitube-platform.svc.cluster.local:3100
    - name: CloudWatch
      type: cloudwatch
      access: proxy
      jsonData:
        # "default" == the AWS SDK default credential chain, which resolves
        # to this pod's IRSA role (aws_iam_role.grafana, envs/lab/iam-platform.tf)
        # -- no static keys involved.
        authType: default
        defaultRegion: us-east-1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  admissionWebhooks:
    # Default (patch.enabled, no certManager) generates the webhook's TLS
    # cert via Helm hook Jobs that ArgoCD's sync/prune cycle races, leaving
    # the Application permanently OutOfSync -- replaced with cert-manager
    # issuing a self-signed cert instead, and a persistent Deployment
    # serving the webhook natively. See docs/adr/011-observability-stack.md.
    certManager:
      enabled: true
    patch:
      enabled: false
    deployment:
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
