# Static values for the aws-load-balancer-controller chart.
# serviceAccount.annotations (the IRSA role ARN) is injected dynamically
# via helm.parameters -- not known until Terraform creates the role.
clusterName: minitube-lab
region: us-east-1

serviceAccount:
  create: true
  name: aws-load-balancer-controller

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
