# ClusterIssuer for Let's Encrypt via Route53 DNS-01. No Certificate
# requests one yet -- CloudFront/ALB use the existing ACM wildcard cert
# instead (docs/adr/008-cloudfront-dns-tls.md). This only proves the
# ClusterIssuer itself reaches Ready.
#
# hostedZoneID is hardcoded: the zone is persistent, so its ID is stable
# across sessions. Source of truth: `terraform output -raw route53_zone_id`
# (terraform/bootstrap/).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-route53
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: alissoncorrealima@hotmail.com
    privateKeySecretRef:
      name: letsencrypt-route53-account-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: Z0190945FAC30FZPOYPT
