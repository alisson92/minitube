# Static values for the promtail chart. Ships every node's container logs
# to Loki -- Loki alone doesn't collect anything. No IRSA role: only talks
# to the in-cluster loki Service. Upstream maintenance-mode (superseded by
# Grafana Alloy) but simplest option for a single-binary Loki.
config:
  clients:
    # loki/values.yaml disables the gateway (gateway.enabled: false) -- talk
    # directly to the singleBinary Service instead of the chart's default
    # (http://loki-gateway/loki/api/v1/push).
    - url: http://loki.minitube-platform.svc.cluster.local:3100/loki/api/v1/push

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
