# EKS kubelet serving certs lack SANs metrics-server's default TLS
# verification accepts (documented AWS gap) -- kubelet traffic stays
# inside the VPC/node security groups, never exposed externally.
args:
  - --kubelet-insecure-tls

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
